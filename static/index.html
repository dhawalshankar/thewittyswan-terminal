<!-- thewittyswan terminal -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>thewittyswan terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0d0d0d;
      font-family: "Courier New", monospace;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation; /* kills double-tap-zoom; elements opt back into pan/none as needed */
    }

    /* invisible probe used purely to read env(safe-area-inset-*) from JS */
    #safeAreaProbe {
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      pointer-events: none;
      visibility: hidden;
    }

    /* ==================================================================
       MOBILE-FIRST BASE STYLES
       Everything below is sized/spaced for small touch screens first.
       Desktop refinements live in the min-width media query at the end.
    ===================================================================*/

    .terminal-window {
      position: fixed;
      width: 320px;   /* JS sets the real initial size on load */
      height: 480px;
      min-width: 280px;
      min-height: 200px;
      background: #111214;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #2a2a2e;
    }

    .terminal-window.dragging,
    .terminal-window.resizing {
      user-select: none;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
    }

    .titlebar {
      background: #1c1d20;
      padding: 10px 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #2a2a2e;
      flex-shrink: 0;
      cursor: grab;
      touch-action: none; /* dragging is handled manually via JS */
    }
    .titlebar.grabbing { cursor: grabbing; }

    .traffic-lights {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .traffic-lights.mirror {
      visibility: hidden;
      pointer-events: none;
    }

    /* Touch-friendly hit target: a 32px button with a small visible dot
       centered inside it, so it looks like a normal traffic light but is
       actually big enough to tap reliably. */
    .dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dot::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: block;
    }
    .dot.red::before { background: #ff5f56; }
    .dot.yellow::before { background: #ffbd2e; }
    .dot.green::before { background: #27c93f; }
    .dot:hover::before { filter: brightness(1.15); }
    .dot:focus-visible { outline: 2px solid #e0c9a6; outline-offset: -2px; border-radius: 50%; }

    .titlebar-label {
      text-align: center;
      color: #8a8a8f;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    #terminal {
      flex: 1;
      padding: 8px;
      min-height: 0; /* required so xterm's internal sizing doesn't overflow flex parent */
      overflow: hidden;
    }

    /* xterm's internal scrolling viewport — make sure it actually scrolls
       (mouse wheel, trackpad, and touch) instead of being clipped by an
       ancestor's overflow:hidden. */
    #terminal .xterm-viewport {
      overflow-y: auto !important;
      touch-action: pan-y !important;
      scrollbar-width: thin;
      scrollbar-color: #3a3a3f #111214;
    }
    #terminal .xterm-viewport::-webkit-scrollbar { width: 10px; }
    #terminal .xterm-viewport::-webkit-scrollbar-track { background: #111214; }
    #terminal .xterm-viewport::-webkit-scrollbar-thumb {
      background: #3a3a3f;
      border-radius: 5px;
    }
    #terminal .xterm-viewport::-webkit-scrollbar-thumb:hover { background: #4a4a50; }
    /* The native up/down scrollbar arrow buttons are unreliable here:
       xterm.js attaches its own mousedown handler to this element (for
       text selection) and, in several browsers, that handler fires and
       calls preventDefault() even when the click actually landed on the
       browser's native scrollbar arrow — which silently cancels the
       scroll. Hiding them and providing our own buttons (below) avoids
       that entirely. */
    #terminal .xterm-viewport::-webkit-scrollbar-button { display: none; height: 0; width: 0; }

    #terminal { position: relative; }
    .scroll-controls {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 5;
    }
    .scroll-btn {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1px solid #2a2a2e;
      background: rgba(28, 29, 32, 0.85);
      color: #8a8a8f;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      padding: 0;
    }
    .scroll-btn:hover { background: #26272b; color: #d8d8dc; }
    .scroll-btn:active { background: #303136; }
    .scroll-btn:focus-visible { outline: 2px solid #e0c9a6; outline-offset: 1px; }

    /* Resize handle, bottom-right corner. Big touch target on mobile by
       default (mobile-first); shrinks for precise mouse pointers in the
       desktop media query below. */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 40px;
      height: 40px;
      cursor: nwse-resize;
      touch-action: none;
      background:
        linear-gradient(135deg, transparent 0 62%, #3a3a3f 62% 68%, transparent 68% 74%, #3a3a3f 74% 80%, transparent 80%);
      opacity: 0.85;
    }
    .resize-handle:hover { opacity: 1; }

    /* small pill shown after the window is closed, so it can be reopened */
    .reopen-pill {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #1c1d20;
      color: #d8d8dc;
      border: 1px solid #2a2a2e;
      border-radius: 999px;
      padding: 12px 20px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
    }
    .reopen-pill.visible { display: block; }

    /* ==================================================================
       DESKTOP ENHANCEMENTS
       Larger default footprint, finer pointer, tighter titlebar controls.
    ===================================================================*/
    @media (min-width: 641px) {
      .titlebar { padding: 10px 14px; }
      .titlebar-label { font-size: 13px; }
      .dot { width: 22px; height: 22px; }
    }
    @media (min-width: 641px) and (pointer: fine) {
      .resize-handle { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
  <div id="safeAreaProbe"></div>

  <div class="terminal-window" id="terminalWindow">
    <div class="titlebar" id="titlebar">
      <div class="traffic-lights">
        <button class="dot red" id="closeBtn" aria-label="Close terminal" title="Close"></button>
        <button class="dot yellow" id="minimizeBtn" aria-label="Minimize terminal" title="Minimize"></button>
        <button class="dot green" id="maximizeBtn" aria-label="Maximize terminal" title="Maximize"></button>
      </div>
      <span class="titlebar-label">swan@thewittyswan — terminal</span>
      <div class="traffic-lights mirror" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
    </div>
    <div id="terminal"></div>
    <div class="scroll-controls" id="scrollControls">
      <button class="scroll-btn" id="scrollUpBtn" aria-label="Scroll up" title="Scroll up">▲</button>
      <button class="scroll-btn" id="scrollDownBtn" aria-label="Scroll down" title="Scroll down">▼</button>
    </div>
    <div class="resize-handle" id="resizeHandle"></div>
  </div>

  <button class="reopen-pill" id="reopenPill">▶ reopen terminal</button>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    const win = document.getElementById("terminalWindow");
    const titlebar = document.getElementById("titlebar");
    const terminalEl = document.getElementById("terminal");
    const resizeHandle = document.getElementById("resizeHandle");
    const reopenPill = document.getElementById("reopenPill");
    const closeBtn = document.getElementById("closeBtn");
    const minimizeBtn = document.getElementById("minimizeBtn");
    const maximizeBtn = document.getElementById("maximizeBtn");
    const safeAreaProbe = document.getElementById("safeAreaProbe");
    const scrollUpBtn = document.getElementById("scrollUpBtn");
    const scrollDownBtn = document.getElementById("scrollDownBtn");

    function isMobile() {
      return window.innerWidth <= 640;
    }

    // Reads env(safe-area-inset-*) (iPhone notch / home-indicator / etc.)
    function getSafeArea() {
      const cs = getComputedStyle(safeAreaProbe);
      return {
        top: parseFloat(cs.paddingTop) || 0,
        right: parseFloat(cs.paddingRight) || 0,
        bottom: parseFloat(cs.paddingBottom) || 0,
        left: parseFloat(cs.paddingLeft) || 0,
      };
    }

    // The usable rectangle right now: shrinks when the mobile keyboard
    // opens (visualViewport), and respects safe-area insets.
    function getViewportRect() {
      const vv = window.visualViewport;
      const safe = getSafeArea();
      const left = (vv ? vv.offsetLeft : 0) + safe.left;
      const top = (vv ? vv.offsetTop : 0) + safe.top;
      const width = (vv ? vv.width : window.innerWidth) - safe.left - safe.right;
      const height = (vv ? vv.height : window.innerHeight) - safe.top - safe.bottom;
      return { left, top, width, height };
    }

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: "Courier New, monospace",
      fontSize: isMobile() ? 13 : 15,
      theme: {
        background: "#111214",
        foreground: "#d8d8dc",
        cursor: "#e0c9a6"
      },
      scrollback: 5000,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(terminalEl);

    // -----------------------------------------------------------------
    // Initial placement & size — responsive, mobile-first: on a phone
    // this fills most of the screen; on larger screens it caps out at a
    // comfortable desktop-window size instead of growing indefinitely.
    // -----------------------------------------------------------------
    function applyInitialLayout() {
      const vp = getViewportRect();
      const w = Math.min(vp.width * 0.94, 900);
      const h = Math.min(vp.height * 0.82, 650);
      win.style.width = w + "px";
      win.style.height = h + "px";
      win.style.left = (vp.left + (vp.width - w) / 2) + "px";
      win.style.top = (vp.top + (vp.height - h) / 2) + "px";
    }
    applyInitialLayout();
    fitAddon.fit();

    // Refit whenever the window's box actually changes size (covers our
    // own resize-handle dragging as well as any other layout shifts).
    const resizeObserver = new ResizeObserver(() => {
      try { fitAddon.fit(); } catch (e) {}
    });
    resizeObserver.observe(win);

    // Keep the window fully inside the current usable rect (accounts for
    // the mobile keyboard shrinking the visual viewport, orientation
    // changes, and safe-area insets).
    function clampToViewport() {
      const vp = getViewportRect();
      const rect = win.getBoundingClientRect();

      let w = Math.min(rect.width, vp.width);
      let h = Math.min(rect.height, vp.height);
      let left = Math.min(Math.max(rect.left, vp.left), vp.left + vp.width - w);
      let top = Math.min(Math.max(rect.top, vp.top), vp.top + vp.height - h);

      win.style.width = w + "px";
      win.style.height = h + "px";
      win.style.left = left + "px";
      win.style.top = top + "px";
    }

    let resizeTimeout;
    function handleViewportResize() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        term.options.fontSize = isMobile() ? 13 : 15;
        clampToViewport();
        try { fitAddon.fit(); } catch (e) {}
      }, 100);
    }
    window.addEventListener("resize", handleViewportResize);
    window.addEventListener("orientationchange", handleViewportResize);
    if (window.visualViewport) {
      // Fires when the on-screen keyboard opens/closes on mobile too.
      window.visualViewport.addEventListener("resize", handleViewportResize);
      window.visualViewport.addEventListener("scroll", handleViewportResize);
    }

    // -----------------------------------------------------------------
    // Dragging the window by its titlebar (mouse + touch, all screens)
    // -----------------------------------------------------------------
    let dragOffsetX = 0, dragOffsetY = 0, dragging = false;

    function startDrag(clientX, clientY) {
      const rect = win.getBoundingClientRect();
      dragOffsetX = clientX - rect.left;
      dragOffsetY = clientY - rect.top;
      dragging = true;
      win.classList.add("dragging");
      titlebar.classList.add("grabbing");
    }

    function doDrag(clientX, clientY) {
      if (!dragging) return;
      const vp = getViewportRect();
      const rect = win.getBoundingClientRect();
      let left = clientX - dragOffsetX;
      let top = clientY - dragOffsetY;
      // keep at least a sliver of the titlebar reachable on-screen
      left = Math.min(Math.max(left, vp.left - rect.width + 80), vp.left + vp.width - 80);
      top = Math.min(Math.max(top, vp.top), vp.top + vp.height - 40);
      win.style.left = left + "px";
      win.style.top = top + "px";
    }

    function endDrag() {
      dragging = false;
      win.classList.remove("dragging");
      titlebar.classList.remove("grabbing");
    }

    titlebar.addEventListener("mousedown", (e) => {
      if (e.target.closest(".dot")) return; // don't drag when tapping a control
      startDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    window.addEventListener("mousemove", (e) => doDrag(e.clientX, e.clientY));
    window.addEventListener("mouseup", endDrag);

    titlebar.addEventListener("touchstart", (e) => {
      if (e.target.closest(".dot")) return;
      const t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (!dragging) return;
      const t = e.touches[0];
      doDrag(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });
    window.addEventListener("touchend", endDrag);
    window.addEventListener("touchcancel", endDrag);

    // -----------------------------------------------------------------
    // Resizing via the bottom-right handle (mouse + touch, all screens)
    // -----------------------------------------------------------------
    let resizing = false, resizeStartX = 0, resizeStartY = 0, startW = 0, startH = 0;

    function startResize(clientX, clientY) {
      const rect = win.getBoundingClientRect();
      resizing = true;
      resizeStartX = clientX;
      resizeStartY = clientY;
      startW = rect.width;
      startH = rect.height;
      win.classList.add("resizing");
    }

    function doResize(clientX, clientY) {
      if (!resizing) return;
      const minW = 280, minH = 200;
      const rect = win.getBoundingClientRect();
      const vp = getViewportRect();
      const maxW = vp.left + vp.width - rect.left;
      const maxH = vp.top + vp.height - rect.top;
      let w = startW + (clientX - resizeStartX);
      let h = startH + (clientY - resizeStartY);
      w = Math.min(Math.max(w, minW), maxW);
      h = Math.min(Math.max(h, minH), maxH);
      win.style.width = w + "px";
      win.style.height = h + "px";
    }

    function endResize() {
      resizing = false;
      win.classList.remove("resizing");
    }

    resizeHandle.addEventListener("mousedown", (e) => {
      startResize(e.clientX, e.clientY);
      e.preventDefault();
      e.stopPropagation();
    });
    window.addEventListener("mousemove", (e) => doResize(e.clientX, e.clientY));
    window.addEventListener("mouseup", endResize);

    resizeHandle.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startResize(t.clientX, t.clientY);
      e.stopPropagation();
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (!resizing) return;
      const t = e.touches[0];
      doResize(t.clientX, t.clientY);
      e.preventDefault();
    }, { passive: false });
    window.addEventListener("touchend", endResize);
    window.addEventListener("touchcancel", endResize);

    // -----------------------------------------------------------------
    // Traffic-light controls: close / minimize / maximize-restore
    // (enabled on every screen size, including mobile)
    // -----------------------------------------------------------------
    let savedRect = null;   // for maximize/restore
    let minimized = false;
    let preMinimizeHeight = null;

    closeBtn.addEventListener("click", () => {
      win.style.display = "none";
      reopenPill.classList.add("visible");
    });
    reopenPill.addEventListener("click", () => {
      win.style.display = "flex";
      reopenPill.classList.remove("visible");
      requestAnimationFrame(() => { try { fitAddon.fit(); } catch (e) {} term.focus(); });
    });

    minimizeBtn.addEventListener("click", () => {
      minimized = !minimized;
      if (minimized) {
        preMinimizeHeight = win.style.height || win.getBoundingClientRect().height + "px";
        terminalEl.style.display = "none";
        resizeHandle.style.display = "none";
        win.style.height = "auto";
      } else {
        terminalEl.style.display = "block";
        resizeHandle.style.display = "block";
        win.style.height = preMinimizeHeight;
        requestAnimationFrame(() => { try { fitAddon.fit(); } catch (e) {} });
      }
    });

    maximizeBtn.addEventListener("click", () => {
      const vp = getViewportRect();
      if (savedRect) {
        // restore
        win.style.left = savedRect.left;
        win.style.top = savedRect.top;
        win.style.width = savedRect.width;
        win.style.height = savedRect.height;
        savedRect = null;
      } else {
        const rect = win.getBoundingClientRect();
        savedRect = {
          left: rect.left + "px",
          top: rect.top + "px",
          width: rect.width + "px",
          height: rect.height + "px"
        };
        win.style.left = vp.left + "px";
        win.style.top = vp.top + "px";
        win.style.width = vp.width + "px";
        win.style.height = vp.height + "px";
      }
    });

    // -----------------------------------------------------------------
    // Custom scroll buttons — these are plain DOM buttons sitting on top
    // of the terminal, outside of xterm's own event handling, so a tap
    // always reaches them (unlike the native scrollbar arrows, see the
    // CSS comment above).
    // -----------------------------------------------------------------
    function wireScrollButton(btn, lines) {
      let holdTimer = null, holdInterval = null;
      const doScroll = () => term.scrollLines(lines);
      const start = (e) => {
        e.preventDefault();
        e.stopPropagation();
        doScroll();
        holdTimer = setTimeout(() => {
          holdInterval = setInterval(doScroll, 80);
        }, 350);
      };
      const stop = () => {
        clearTimeout(holdTimer);
        clearInterval(holdInterval);
      };
      btn.addEventListener("mousedown", start);
      btn.addEventListener("touchstart", start, { passive: false });
      ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(ev =>
        btn.addEventListener(ev, stop)
      );
    }
    wireScrollButton(scrollUpBtn, -3);
    wireScrollButton(scrollDownBtn, 3);

    // -----------------------------------------------------------------
    // Terminal-tap-to-focus (mobile keyboard) — but never while dragging
    // or resizing, so a scroll/drag gesture doesn't get hijacked.
    // -----------------------------------------------------------------
    terminalEl.addEventListener("touchend", () => {
      if (!dragging && !resizing) term.focus();
    });

    const prompt = "swan@thewittyswan:~$ ";
    let currentLine = "";
    let busy = false;

    // Command history
    const history = [];
    let historyIndex = -1; // -1 means "not currently browsing history"

    function writePrompt() {
      term.write("\r\n" + prompt);
    }
    function showBanner() {
      term.writeln("");
      term.writeln(center("TheWittySwan"));
      term.writeln(center("Interactive Portfolio Terminal"));
      term.writeln("");
      term.writeln(center("Dhawal Shukla"));
      term.writeln("");
      term.writeln(center("Backend Engineering • Network Security • Cloud"));
      term.writeln("");
      term.writeln(center("Type 'help' to explore."));
      term.writeln("");
    }
    function center(text) {
      const cols = term.cols;
      const padding = Math.max(0, Math.floor((cols - text.length) / 2));
      return " ".repeat(padding) + text;
    }
    function clearCurrentLine() {
      term.write("\b \b".repeat(currentLine.length));
    }

    function navigateHistory(direction) {
      if (history.length === 0) return;

      if (direction === -1) { // Up
        if (historyIndex === -1) {
          historyIndex = history.length - 1;
        } else if (historyIndex > 0) {
          historyIndex--;
        } else {
          return; // already at oldest
        }
      } else { // Down
        if (historyIndex === -1) return; // nothing to go "down" to
        if (historyIndex < history.length - 1) {
          historyIndex++;
        } else {
          historyIndex = -1; // back to a blank line
        }
      }

      clearCurrentLine();
      currentLine = historyIndex === -1 ? "" : history[historyIndex];
      term.write(currentLine);
    }

    showBanner();
    writePrompt();
    term.focus();

    // onData (not onKey) fires after the browser/OS has resolved the
    // actual character — this correctly handles mobile autocorrect,
    // predictive text, IME composition, and pasted text.
    term.onData(async (data) => {
      if (busy) return; // ignore input while a command is in flight

      let i = 0;
      while (i < data.length) {
        const char = data[i];
        const code = char.charCodeAt(0);

        // Arrow keys arrive as a 3-byte escape sequence: ESC [ A/B/C/D.
        if (code === 27 && data[i + 1] === "[") {
          const seq = data[i + 2];
          if (seq === "A") navigateHistory(-1);      // Up
          else if (seq === "B") navigateHistory(1);   // Down
          // Left/Right (C/D) intentionally not handled yet.
          i += 3;
          continue;
        }

        if (char === "\r") { // Enter
          const command = currentLine.trim();
          term.write("\r\n");

          currentLine = "";
          historyIndex = -1;

          if (command.length > 0 && history[history.length - 1] !== command) {
            history.push(command);
          }

          if (command === "clear") {
            term.clear();
            showBanner();
            writePrompt();
            return;
          }

          if (command === "history") {
            if (history.length === 0) {
              term.writeln("No commands in history.");
            } else {
              history.forEach((cmd, idx) => {
                term.writeln(`${idx + 1}  ${cmd}`);
              });
            }
            writePrompt();
            return;
          }

          if (command.length === 0) {
            writePrompt();
            return;
          }

          busy = true;

          try {
            const res = await fetch("/run", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ command })
            });

            const text = await res.text();
            term.write(text.replace(/\r?\n/g, "\r\n"));
          } catch (err) {
            term.write("error: could not reach server");
          }

          busy = false;
          writePrompt();
        } else if (char === "\b" || code === 127) {
          if (currentLine.length > 0) {
            currentLine = currentLine.slice(0, -1);
            term.write("\b \b");
          }
        } else if (code < 32) {
          // ignore other control characters (Tab, etc.)
        } else {
          currentLine += char;
          term.write(char);
        }

        i += 1;
      }
    });
  </script>
</body>
