# .github/workflows/deploy.yml
name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

env:
  APP_DIR: /home/dhawalmannu/thewittyswan-terminal
  SERVICE_NAME: thewittyswan-terminal

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Run existing VM deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd '${{ env.APP_DIR }}'
            ./deploy.sh
            sudo -n systemctl is-active --quiet '${{ env.SERVICE_NAME }}'
            test -s "$HOME/.ssh/authorized_keys"
            echo "VM authorized_keys present"
